  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
  html,body{margin:0; background:var(--bg); color:var(--t1); font-family:"Oswald","Arial Narrow",system-ui,sans-serif;}
  body{min-height:100dvh; display:flex; justify-content:center;}

  .device{width:100%; max-width:440px; min-height:100dvh; display:flex; flex-direction:column;
    background:#0b0a0e;
    position:relative; padding:18px 15px calc(10px + env(safe-area-inset-bottom));
    box-shadow: inset 0 0 140px rgba(0,0,0,.72), inset 0 2px 0 rgba(255,255,255,.04);}
  .device > .texbg{position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:var(--tex); background-size:190px; opacity:.5;}
  /* Inhalt ueber die Korn-Ebene heben, damit Logo/Timer nicht vergraut werden */
  .head, .timerrow, .controls, .nav, .foot{ position:relative; z-index:1; }
  .device::before{content:""; position:absolute; inset:0; pointer-events:none; z-index:60; border:2px solid transparent;}
  .device.live::before{ border-color:var(--pink); animation:recpulse 1.1s steps(1,end) infinite; }
  @keyframes recpulse{ 0%,55%{border-color:var(--pink);} 56%,100%{border-color:transparent;} }

  /* Eck-Schrauben */
  .screw{position:absolute; width:9px; height:9px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #3a3842, #0c0b10 75%); border:1px solid #000; z-index:50;}
  .screw.tl{top:8px; left:8px;} .screw.tr{top:8px; right:8px;}
  .screw.bl{bottom:8px; left:8px;} .screw.br{bottom:8px; right:8px;}

  /* Material-Mixin fuer Felder: Textur + Lichtkante oben + Schatten unten */
  .surf{ position:relative; background-color:var(--block);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.16),
      inset 1.5px 0 0 rgba(255,255,255,.04),
      inset -1.5px 0 0 rgba(0,0,0,.5),
      inset 0 -3px 1px rgba(0,0,0,.85),
      inset 0 -10px 16px rgba(0,0,0,.5),
      0 4px 7px rgba(0,0,0,.68),
      0 1px 0 rgba(255,255,255,.05);}
  .surf::before{ content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:var(--tex); background-size:130px; opacity:.55;}
  .surf > *{ position:relative; z-index:1; }

  /* HEADER */
  .head{display:flex; align-items:flex-start; justify-content:space-between; padding:2px 4px 16px;}
  .brand{display:flex; flex-direction:column; gap:5px;}
  .logo{font-family:"Anton",sans-serif; font-weight:400; font-size:38px; line-height:1; letter-spacing:1px; text-transform:uppercase; color:#fff;
    text-shadow:0 0 1px rgba(255,255,255,.6), 0 0 16px rgba(255,255,255,.30), 0 0 34px rgba(255,255,255,.12);}
  .logo em{font-style:normal; color:var(--pink); margin-left:6px;
    text-shadow:0 0 1px rgba(255,39,133,.7), 0 0 16px rgba(255,39,133,.55), 0 0 36px rgba(255,39,133,.3);}
  .brandsub{display:flex; align-items:center; gap:7px; padding-left:3px;
    font-family:"Space Mono",ui-monospace,monospace; font-size:9px; letter-spacing:4px; color:var(--t2);}
  .brandsub .sq{width:6px; height:6px; background:var(--pink); display:block; box-shadow:0 0 7px rgba(255,39,133,.6);}
  .grid-ic{display:grid; grid-template-columns:repeat(3,6px); gap:4px; cursor:pointer; padding:4px; margin-top:3px;}
  .grid-ic i{width:6px; height:6px; background:var(--pink); display:block; box-shadow:0 0 6px rgba(255,39,133,.55);}
  .grid-ic.off i{background:var(--t2); box-shadow:none;}
  body.bright .logo, body.bright .logo em{color:#0a0007; text-shadow:none;}
  body.bright .grid-ic i{box-shadow:none;}
  body.bright .brandsub .sq{box-shadow:none;}

  /* MODULE */
  .modgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:11px;}
  .mod{border:1px solid #1b1922; border-top-color:#2f2c38; padding:15px 15px; display:flex; align-items:center; gap:11px;
    cursor:pointer; position:relative; min-height:58px; overflow:hidden; background-color:var(--block);}
  .mod:active{ transform:translateY(1px); }
  .mod::before{ content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:var(--tex); background-size:130px; opacity:.55;}
  .mod > *{ position:relative; z-index:1; }
  .mod .ic{color:var(--t2); display:flex;}
  .mod .lb{font-size:15px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--t1);}
  .mod .n{margin-left:auto; font-family:"Space Mono",ui-monospace,monospace; font-size:15px; color:var(--t1); font-weight:700;}
  .mod.record{border-color:var(--pink);}
  .mod.record .dot{width:11px; height:11px; border-radius:50%; background:var(--green);}
  .mod.record.live .dot{background:var(--pink);}
  .mod.record .stripes{position:absolute; right:0; top:0; bottom:0; width:72px;
    background:repeating-linear-gradient(135deg, transparent 0 7px, var(--pink) 7px 10px); opacity:.5;}

  /* WAVEFORM */
  .wavewrap{border:1px solid #000; border-top-color:#17151d; margin-bottom:11px; position:relative; overflow:hidden;
    background-color:#05070a;
    box-shadow: inset 0 4px 11px rgba(0,0,0,.95), inset 0 0 0 1px rgba(0,0,0,.7), inset 0 -2px 0 rgba(255,255,255,.03), 0 1px 0 rgba(255,255,255,.04);}
  .wavewrap .corner{position:absolute; width:14px; height:14px; border:3px solid var(--green); z-index:2;}
  .wavewrap .c1{top:4px; left:4px; border-right:0; border-bottom:0;}
  .wavewrap .c2{top:4px; right:4px; border-left:0; border-bottom:0;}
  .wavewrap .c3{bottom:34px; left:4px; border-right:0; border-top:0;}
  .wavewrap .c4{bottom:34px; right:4px; border-left:0; border-top:0;}
  .wavewrap canvas{width:100%; height:120px; display:block;}
  /* Pegel-Balken */
  .levelrow{display:flex; align-items:center; gap:8px; padding:7px 12px 9px; border-top:1px solid var(--border);}
  .levelrow .io{font-family:"Space Mono",ui-monospace,monospace; font-size:9px; letter-spacing:2px; color:var(--t2);}
  .levelbar{flex:1; height:6px; background:#000; position:relative; overflow:hidden;}
  .levelbar .fill{position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--pink); transition:width .06s linear;}
  .levelbar .ticks{position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0 11px, rgba(0,0,0,.6) 11px 12px);}

  /* INFO */
  .info{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-bottom:12px;}
  .info>div{border:1px solid var(--border-hi); padding:11px 0 9px; display:flex; flex-direction:column; align-items:center; gap:2px; position:relative;}
  .info .v{font-family:"Oswald","Arial Narrow",system-ui,sans-serif; font-weight:700; font-size:22px; line-height:1; color:var(--t1);}
  .info .u{font-family:"Space Mono",ui-monospace,monospace; font-size:8px; letter-spacing:1px; color:var(--t2);}
  .info .bpm{border-color:var(--green);}
  .info .bpm .v{color:var(--green);}
  .info .bpm{box-shadow: inset 0 3px 8px rgba(0,0,0,.85), inset 0 0 13px rgba(50,235,164,.22), inset 0 0 0 1px rgba(50,235,164,.12), 0 1px 0 rgba(255,255,255,.05) !important;}
  .info .pk{cursor:ns-resize;}
  .info .mbtn{cursor:pointer;}
  .info .mbtn.on{border-color:var(--green);}
  .info .mbtn.on .v{color:var(--green);}

  /* TIMER */
  .timerrow{text-align:center; padding:14px 0 10px;}
  .timer{font-family:"Oswald","Arial Narrow",system-ui,sans-serif; font-weight:700; font-size:58px; line-height:.9; letter-spacing:1px; color:var(--t1); font-variant-numeric:tabular-nums;}
  .tstat{font-family:"Oswald","Arial Narrow",system-ui,sans-serif; font-weight:600; font-size:14px; letter-spacing:4px; color:var(--t2); margin-top:4px; display:flex; align-items:center; justify-content:center; gap:8px; text-transform:uppercase;}
  .tstat .rd{width:8px;height:8px;border-radius:50%;background:var(--pink);display:none;}
  .tstat.rec{color:var(--pink);} .tstat.rec .rd{display:inline-block;}

  /* TRANSPORT - Hardware-Tasten im Montagerahmen, Licht von oben-links, kein Glow */
  .controls{display:flex; align-items:center; justify-content:center; gap:24px; padding:8px 0 16px;}

  /* kleine Tasten: dunkle Taste, versenkt im Rahmen */
  .cbtn{position:relative; width:66px; height:66px; background:#060507; border:0; padding:0; cursor:pointer;
    clip-path:var(--oct8);
    box-shadow: inset 0 3px 6px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05);
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));}
  .cbtn .face{position:absolute; inset:5px; clip-path:var(--oct8); background:#1b1a21; overflow:hidden;
    display:flex; align-items:center; justify-content:center; color:var(--t1);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.11), inset 0 0 0 1px rgba(0,0,0,.5);
    transition:transform .08s;}
  .cbtn .face::before{content:""; position:absolute; inset:0; background-image:var(--tex); background-size:110px; opacity:.35; z-index:0;}
  .cbtn .face svg{position:relative; z-index:1;}
  .cbtn:active .face{transform:scale(.93);}
  .cbtn:disabled{filter:drop-shadow(0 1px 2px rgba(0,0,0,.4)); cursor:default;}
  .cbtn:disabled .face{background:#131219; color:var(--t2); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), inset 0 0 0 1px rgba(0,0,0,.45);}

  /* Record: pinke Taste im Montagerahmen, Licht oben-links, Burgund unten-rechts */
  .stopbtn{position:relative; width:118px; height:118px; cursor:pointer; clip-path:var(--octS); background:#060507;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.92), inset 0 1px 0 rgba(255,255,255,.055);
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));}
  .stopbtn .face{position:absolute; inset:6px; clip-path:var(--octS); background:var(--pink); overflow:hidden;
    display:flex; align-items:center; justify-content:center; transition:transform .1s;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.32),
      inset 0 0 0 1px rgba(5,3,6,.45);}
  .stopbtn .face::before{content:""; position:absolute; inset:0; background-image:var(--tex); background-size:110px; opacity:.12; z-index:0;}
  .stopbtn .sym{position:relative; z-index:1; width:32px; height:32px; background:var(--bg); transition:all .12s;
    clip-path:var(--octS); box-shadow: inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,130,175,.18);}
  .stopbtn:active .face{transform:scale(.96);}
  .stopbtn.live .sym{clip-path:none; width:30px; height:30px; border-radius:3px;}

  /* NAV */
  .nav{margin-top:auto; display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--border-hi);}
  .nav .tab{padding:14px 0 10px; display:flex; flex-direction:column; align-items:center; gap:5px;
    font-family:"Space Mono",ui-monospace,monospace; font-size:9px; letter-spacing:2px; color:var(--t2); cursor:pointer; border-right:1px solid var(--border);}
  .nav .tab:last-child{border-right:0;}
  .nav .tab.on{color:var(--green);}
  .nav .tab svg{width:18px; height:18px;}

  .foot{display:flex; justify-content:space-between; padding:8px 4px 0;
    font-family:"Space Mono",ui-monospace,monospace; font-size:8px; letter-spacing:2px; color:#3a3742;}
  .foot .rev{color:var(--pink);}
  audio{display:none;}

  body.bright{--bg:#FF2785; --t1:#0a0007; --t2:#8a0845; --border:#d81f6e; --border-hi:#b01458;
    --pink:#0a0007; --green:#0a0007; --block:#ff46a0;}
  body.bright .device{background:#ff3d96;}
  body.bright .stopbtn{background:#0a0007;}
  body.bright .stopbtn .sym{background:#FF2785;}
  body.bright .wavewrap{background-color:#ff5ba8;}
</style>

<body>
<div class="device" id="device">

    <div class="tab" id="tabFx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="4" x2="6" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="18" y1="4" x2="18" y2="20"/></svg>FX</div>
    <div class="tab" id="tabSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>SETTINGS</div>
  </div>

  <div class="foot"><span>SNAD INDUSTRIES</span><span class="rev">REV 0.55</span></div>
</div>

<script type="module">
/* DREX MB  REV 0.55  -  Material-Durchgang: extrudierte Tasten mit Flanke+Press, erhabene Module, eingelassenes Display, zweifarbige Welle gruen->pink, ruhende Idle-Welle. Audio-Engine unveraendert. */
const $=(id)=>document.getElementById(id);
const device=$("device");
const waveCanvas=$("wave"), wctx=waveCanvas.getContext("2d");
function sizeCanvas(){
  const r=waveCanvas.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  waveCanvas.width=r.width*dpr; waveCanvas.height=r.height*dpr;
  wctx.setTransform(dpr,0,0,dpr,0,0);
}
let waveHist=new Array(110).fill(0);
let playHead=-1;
const GREEN=0x32EBA4, PINK=0xFF2785;
function lerpCol(a,b,t){
  const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255, br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
  return "rgb("+Math.round(ar+(br-ar)*t)+","+Math.round(ag+(bg-ag)*t)+","+Math.round(ab+(bb-ab)*t)+")";
}
function drawWave(){
  const w=waveCanvas.getBoundingClientRect().width, h=waveCanvas.getBoundingClientRect().height;
  wctx.clearRect(0,0,w,h);
  const mid=h/2, n=waveHist.length, step=w/n;
  // gruenes Punkt-Raster
  wctx.fillStyle="rgba(50,235,164,0.09)";
  for(let gy=10; gy<h; gy+=13) for(let gx=8; gx<w; gx+=13){ wctx.fillRect(gx,gy,1.4,1.4); }
  // Welle, zweifarbig gruen -> pink ueber die Breite
  for(let i=0;i<n;i++){
    const t=i/(n-1||1), v=waveHist[i], bh=Math.max(1.6, v*h*0.88), x=i*step;
    wctx.fillStyle=lerpCol(GREEN,PINK,t);
    wctx.fillRect(x, mid-bh/2, Math.max(1.6,step-1.3), bh);
  }
  if(playHead>=0){ const x=playHead*w; wctx.fillStyle="#FF2785"; wctx.fillRect(x-1,0,2,h); }
}
function pushWave(v){ waveHist.push(v); if(waveHist.length>110) waveHist.shift(); drawWave(); }

// Ruhende Welle im Leerlauf: leises, langsames Atmen statt toter Mittellinie
let idleRaf=null, idlePhase=0;
function idleWave(){
  idlePhase+=0.035;
  const n=waveHist.length, arr=new Array(n);
  for(let i=0;i<n;i++){
    const t=i/(n-1||1), env=0.5-0.5*Math.cos(t*Math.PI*2);
    const base=Math.abs(Math.sin(t*9+idlePhase)*0.5+Math.sin(t*3.3-idlePhase*0.7)*0.5);
    arr[i]=base*0.13*(0.35+0.65*env);
  }
  waveHist=arr; drawWave();
  idleRaf=requestAnimationFrame(idleWave);
}
function startIdle(){ if(!idleRaf) idleRaf=requestAnimationFrame(idleWave); }
function stopIdle(){ if(idleRaf){ cancelAnimationFrame(idleRaf); idleRaf=null; } }

let mediaStream=null, recorder=null, chunks=[], recWavBlob=null, recUrl=null;
let analyser=null, acMon=null, rafId=null, recStart=0, timerIv=null;
let recState="idle", countTimers=[];
let bpm=120, metroOn=false, metroRoot=69, takeN=0;

const recBtn=$("recBtn"), playBtn=$("playBtn"), resetBtn=$("resetBtn"),
      player=$("player"), timerEl=$("timer"), tstat=$("tstat"), tstatTx=$("tstatTx"),
      clip=$("clip"), levelFill=$("levelFill"), recModLb=$("recModLb"), recMod=$("recMod"),
      bpmBox=$("bpmBox"), bpmVal=$("bpmVal"), metroBtn=$("metroBtn"), metroNote=$("metroNote"),
      takeNEl=$("takeN");

const NOTE_NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function noteShort(midi){ return NOTE_NAMES[((midi%12)+12)%12]; }
function midiToHz(midi){ return 440*Math.pow(2,(midi-69)/12); }
function scheduleClick(ac, time, accent){
  const osc=ac.createOscillator(), g=ac.createGain();
  osc.type="sine"; osc.frequency.value=midiToHz(metroRoot);
  osc.connect(g); g.connect(ac.destination);
  if(accent){ g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(0.34,time+0.004); g.gain.exponentialRampToValueAtTime(0.0001,time+0.18); osc.start(time); osc.stop(time+0.22); }
  else{ g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(0.13,time+0.002); g.gain.exponentialRampToValueAtTime(0.0001,time+0.06); osc.start(time); osc.stop(time+0.08); }
}
function fmtTime(ms){ const s=ms/1000,m=Math.floor(s/60),r=(s%60); return String(m).padStart(2,"0")+":"+r.toFixed(1).padStart(4,"0"); }
function pickMime(){ const o=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac"]; for(const m of o){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; } return ""; }

async function startRec(){
  try{ mediaStream=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }, video:false }); }
  catch(e){ recModLb.textContent="MIC DENIED"; return; }
  const AC=window.AudioContext||window.webkitAudioContext;
  acMon=new AC();
  const src=acMon.createMediaStreamSource(mediaStream);
  analyser=acMon.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.3; src.connect(analyser);
  chunks=[];
  const mime=pickMime();
  try{ recorder=mime?new MediaRecorder(mediaStream,{mimeType:mime}):new MediaRecorder(mediaStream); }
  catch(e){ recModLb.textContent="RECORDER ERR"; return; }
  recorder.ondataavailable=(ev)=>{ if(ev.data&&ev.data.size) chunks.push(ev.data); };
  recorder.onstop=onRecStop;
  recBtn.classList.add("live"); recMod.classList.add("live");
  playBtn.disabled=true; resetBtn.disabled=true; playHead=-1;
  stopIdle();
  waveHist=new Array(110).fill(0);
  meterLoop();
  const beatDur=60/bpm, countBeats=4, t0=acMon.currentTime+0.12;
  for(let i=0;i<countBeats;i++) scheduleClick(acMon, t0+i*beatDur, i%4===0);
  recState="countin";
  let ci=countBeats;
  recModLb.textContent="COUNT "+ci; tstatTx.textContent="COUNT-IN";
  const ciIv=setInterval(()=>{ ci--; if(ci>0){ recModLb.textContent="COUNT "+ci; } },beatDur*1000);
  countTimers.push(ciIv);
  countTimers.push(setTimeout(()=>{
    clearInterval(ciIv);
    if(recState!=="countin") return;
    try{ recorder.start(); }catch{}
    recState="recording"; device.classList.add("live");
    recModLb.textContent="REC"; tstat.classList.add("rec"); tstatTx.textContent="RECORDING";
    recStart=performance.now();
    timerIv=setInterval(()=>{ timerEl.textContent=fmtTime(performance.now()-recStart); },100);
    if(metroOn) startMetro();
  }, countBeats*beatDur*1000));
}
let metroIv=null, metroBeat=0;
function startMetro(){ const beatDur=60/bpm; metroBeat=0; metroIv=setInterval(()=>{ if(!acMon) return; scheduleClick(acMon, acMon.currentTime+0.02, metroBeat%4===0); metroBeat++; }, beatDur*1000); }
function stopMetro(){ if(metroIv){ clearInterval(metroIv); metroIv=null; } }

function meterLoop(){
  if(!analyser) return;
  const buf=new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let peak=0; for(let i=0;i<buf.length;i++){ const a=Math.abs(buf[i]); if(a>peak) peak=a; }
  const db = peak>0 ? 20*Math.log10(peak) : -90;
  let frac=(db+54)/54; if(frac<0)frac=0; if(frac>1)frac=1;
  pushWave(frac);
  levelFill.style.width=(frac*100).toFixed(1)+"%";
  const over = db>-1.5;
  clip.textContent = over ? "CLIP" : "OUT";
  clip.style.color = over ? "var(--pink)" : "var(--t2)";
  rafId=requestAnimationFrame(meterLoop);
}

function stopRec(){
  stopMetro();
  countTimers.forEach(t=>{ clearTimeout(t); clearInterval(t); }); countTimers=[];
  device.classList.remove("live");
  if(recState==="countin"){
    recState="idle";
    if(timerIv){ clearInterval(timerIv); timerIv=null; }
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
    if(acMon){ acMon.close(); acMon=null; } analyser=null;
    recBtn.classList.remove("live"); recMod.classList.remove("live"); tstat.classList.remove("rec");
    recModLb.textContent="RECORD"; tstatTx.textContent="READY TO RECORD"; levelFill.style.width="0%";
    startIdle();
    return;
  }
  recState="idle";
  if(recorder&&recorder.state!=="inactive") recorder.stop();
  if(timerIv){ clearInterval(timerIv); timerIv=null; }
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
}

async function onRecStop(){
  stopMetro();
  if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
  if(acMon){ acMon.close(); acMon=null; } analyser=null;
  recBtn.classList.remove("live"); recMod.classList.remove("live"); device.classList.remove("live"); tstat.classList.remove("rec");
  recModLb.textContent="PROCESS"; levelFill.style.width="0%";
  const raw=new Blob(chunks,{type:chunks[0]?chunks[0].type:"audio/webm"});
  try{ recWavBlob=await toWav(raw); }catch(e){ recModLb.textContent="WAV ERR"; return; }
  await fillWaveFromBlob(recWavBlob);
  if(recUrl) URL.revokeObjectURL(recUrl);
  recUrl=URL.createObjectURL(recWavBlob);
  player.src=recUrl;
  playBtn.disabled=false; resetBtn.disabled=false;
  takeN++; takeNEl.textContent=takeN;
  recModLb.textContent="RECORD"; tstatTx.textContent="TAKE "+takeN+" READY";
  clip.textContent="OUT"; clip.style.color="var(--t2)";
}
async function fillWaveFromBlob(blob){
  try{
    const ab=await blob.arrayBuffer();
    const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC();
    const audio=await ac.decodeAudioData(ab.slice(0));
    const data=audio.getChannelData(0), n=110, block=Math.floor(data.length/n), arr=[];
    for(let i=0;i<n;i++){ let p=0; for(let j=0;j<block;j++){ const a=Math.abs(data[i*block+j]||0); if(a>p)p=a; } arr.push(Math.min(1,p*1.1)); }
    ac.close(); waveHist=arr; drawWave();
  }catch(e){}
}
async function toWav(blob){
  const ab=await blob.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC();
  const audio=await ac.decodeAudioData(ab); const wav=encodeWav(audio); ac.close();
  return new Blob([wav],{type:"audio/wav"});
}
function encodeWav(ab){
  const nCh=ab.numberOfChannels, sr=ab.sampleRate, len=ab.length;
  const ch=[]; for(let c=0;c<nCh;c++) ch.push(ab.getChannelData(c));
  const blockAlign=nCh*2, dataLen=len*blockAlign;
  const buffer=new ArrayBuffer(44+dataLen), view=new DataView(buffer);
  const ws=(o,s)=>{ for(let i=0;i<s.length;i++) view.setUint8(o+i,s.charCodeAt(i)); };
  ws(0,"RIFF"); view.setUint32(4,36+dataLen,true); ws(8,"WAVE");
  ws(12,"fmt "); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,nCh,true); view.setUint32(24,sr,true);
  view.setUint32(28,sr*blockAlign,true); view.setUint16(32,blockAlign,true); view.setUint16(34,16,true);
  ws(36,"data"); view.setUint32(40,dataLen,true);
  let off=44;
  for(let i=0;i<len;i++) for(let c=0;c<nCh;c++){ let s=ch[c][i]; s=s<-1?-1:s>1?1:s; view.setInt16(off, s<0?s*0x8000:s*0x7fff, true); off+=2; }
  return buffer;
}
function resetRec(){
  recWavBlob=null;
  if(recUrl){ URL.revokeObjectURL(recUrl); recUrl=null; }
  player.src=""; playHead=-1;
  playBtn.disabled=true; resetBtn.disabled=true;
  timerEl.textContent="00:00.0"; tstat.classList.remove("rec"); tstatTx.textContent="READY TO RECORD";
  recModLb.textContent="RECORD"; levelFill.style.width="0%";
  waveHist=new Array(110).fill(0); drawWave(); startIdle();
}
let playRaf=null;
function startPlayhead(){
  cancelAnimationFrame(playRaf);
  const dur=player.duration||1;
  const tick=()=>{ if(player.paused||player.ended){ playHead=-1; drawWave(); return; } playHead=Math.min(1, player.currentTime/dur); drawWave(); playRaf=requestAnimationFrame(tick); };
  tick();
}
player.addEventListener("ended", ()=>{ playHead=-1; drawWave(); });

recBtn.addEventListener("click", ()=>{ if(recState==="recording"||recState==="countin") stopRec(); else startRec(); });
playBtn.addEventListener("click", ()=>{ if(player.src){ player.currentTime=0; player.play(); startPlayhead(); } });
resetBtn.addEventListener("click", resetRec);

metroBtn.addEventListener("click", ()=>{ metroOn=!metroOn; metroBtn.classList.toggle("on", metroOn); if(recState==="recording"){ if(metroOn) startMetro(); else stopMetro(); } });
metroNote.textContent=noteShort(metroRoot);
metroBtn.addEventListener("dblclick",()=>{ metroRoot++; if(metroRoot>72) metroRoot=48; metroNote.textContent=noteShort(metroRoot); });

function setBpm(v){ bpm=Math.max(40,Math.min(240,Math.round(v))); bpmVal.textContent=bpm; }
let bpmDragY=null, bpmStart=0;
bpmBox.addEventListener("pointerdown",(e)=>{ bpmDragY=e.clientY; bpmStart=bpm; bpmBox.setPointerCapture(e.pointerId); });
bpmBox.addEventListener("pointermove",(e)=>{ if(bpmDragY===null) return; setBpm(bpmStart+(bpmDragY-e.clientY)*0.5); });
bpmBox.addEventListener("pointerup",()=>{ bpmDragY=null; });

$("modeGrid").addEventListener("click",()=>{ document.body.classList.toggle("bright"); $("modeGrid").classList.toggle("off"); });

sizeCanvas(); drawWave(); startIdle();
window.addEventListener("resize", ()=>{ sizeCanvas(); drawWave(); });
</script>
</body>
</html>
