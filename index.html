<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DREX-MB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0607; --panel:#140d0e; --panel2:#0c0707;
    --line:#2a1c18; --ink:#f2ddd8; --dim:#8a5a54;
    --sig:#ff4532; --sig-deep:#5e130d; --info:#ff6a00; --ok:#5bd98a; --yellow:#ffea00;
    --acc:#e5237f; --acc-deep:#5e0c35; --acc-glow:#ff3d93;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
  html,body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Space Mono","Courier New",monospace; letter-spacing:.02em;}
  body{min-height:100dvh; display:flex; justify-content:center;}

  .device{width:100%; max-width:430px; min-height:100dvh; display:flex; flex-direction:column;
    background:linear-gradient(170deg,var(--panel),#080506);
    border-left:1px solid var(--line); border-right:1px solid var(--line);
    padding:16px 16px calc(14px + env(safe-area-inset-bottom)); gap:14px;
    position:relative; --shimmer:0;}
  /* Schimmern im Takt des Eingangssignals */
  .device::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    box-shadow:inset 0 0 calc(40px * var(--shimmer)) rgba(229,35,127,calc(.5 * var(--shimmer)));
    transition:box-shadow .05s linear;}

  header{display:flex; justify-content:space-between; align-items:flex-start; padding:2px;}
  .brand .ind{color:#9a6a7a; font-size:8px; letter-spacing:2px; display:flex; align-items:center; gap:5px;}
  .brand .ind i{width:5px;height:5px;border-radius:50%;background:var(--acc);display:inline-block;box-shadow:0 0 6px var(--acc-glow);}
  .brand .name{color:var(--acc); font-family:"Anton",sans-serif; font-size:40px; font-weight:400;
    letter-spacing:1px; line-height:.95; margin:2px 0; text-shadow:0 0 18px rgba(229,35,127,.4);}
  .brand .tag{color:#6a3a4a; font-size:7px; letter-spacing:4px;}
  .modes{display:flex; gap:7px; margin-top:6px;}
  .modes span{width:15px;height:15px;border-radius:50%;cursor:pointer;}
  .modes .d{background:var(--acc);box-shadow:0 0 8px var(--acc-glow);}
  .modes .b{border:1px solid #6a3a4a;}

  .status{background:#000; border:1px solid var(--acc-deep); border-radius:10px;
    padding:8px 12px; font-size:10px; display:flex; justify-content:space-between; align-items:center;}
  .status .s{color:var(--ok); letter-spacing:1px;}
  .status .clip{color:#5a3a34; letter-spacing:1px;}
  .status .clip.on{color:var(--sig);}

  .meterbox{background:radial-gradient(ellipse at 50% 12%,#201410,#0c0707 78%);
    border:1px solid var(--line); border-radius:16px; padding:12px 10px 4px;
    box-shadow:inset 0 2px 22px #0008;}
  .meterbox svg{width:100%; display:block;}

  .metroline{display:flex; gap:8px; align-items:stretch;}
  .bpm{flex:1; background:#120c0d; border:1px solid var(--line); border-radius:11px;
    display:flex; align-items:baseline; justify-content:center; gap:6px; padding:9px 0; cursor:ns-resize;}
  .bpm-val{color:var(--ok); font-size:20px; font-weight:700; letter-spacing:1px;}
  .bpm-unit{color:var(--dim); font-size:9px; letter-spacing:2px;}
  .metrobtn{flex:0 0 52px; display:flex; align-items:center; justify-content:center;
    background:#1a1012; border:1px solid var(--line); border-radius:11px; color:var(--dim); padding:0;}
  .metrobtn.on{color:var(--acc); border-color:var(--acc); box-shadow:0 0 12px rgba(229,35,127,.3);}
  .metronote{flex:0 0 56px; font-family:"Space Mono",monospace; font-size:16px; font-weight:700;
    background:#1a1012; border:1px solid var(--line); border-radius:11px; color:#4a3a3a; padding:0;}
  .metronote.on{color:var(--acc-glow);}

  .recband{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .timer{color:var(--ok); font-size:26px; letter-spacing:4px; transition:text-shadow .2s;}
  .timer.rec{color:var(--acc-glow); text-shadow:0 0 14px rgba(255,61,147,.5);}
  .timer-sub{color:#5a3a34; font-size:8px; letter-spacing:2px;}
  .recbtn{width:118px;height:118px;border-radius:50%;border:2px solid #241218;
    display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:6px;transition:transform .06s, box-shadow .2s;}
  .recbtn:active{transform:scale(.97);}
  .recbtn.on{box-shadow:0 0 28px rgba(91,217,138,.4);}
  .recbtn .ring{width:100px;height:100px;border-radius:50%;background:#0a1510;border:3px solid var(--ok);
    display:flex;align-items:center;justify-content:center;transition:border-color .2s;}
  .recbtn.on .ring{border-color:#7dffb0;}
  .recbtn .core{width:44px;height:44px;border-radius:50%;
    background:linear-gradient(180deg,#ff5c4a,#b22a20);transition:all .15s;}
  .recbtn.on .core{border-radius:8px;width:36px;height:36px;}
  .rec-hint{color:var(--dim); font-size:9px; letter-spacing:3px;}

  .rec-sub{display:flex; gap:10px;}
  .rec-sub button{flex:1;}
  button{font-family:inherit;font-weight:700;letter-spacing:.06em;color:var(--ink);
    background:#1a1012;border:1px solid var(--line);border-radius:11px;
    padding:12px 14px;font-size:12px;cursor:pointer;transition:transform .05s, box-shadow .15s;}
  button:active{transform:scale(.98);}
  button:disabled{opacity:.3;}
  /* aktiver Anhoeren-Button: Pink-Akzent, klar klickbar */
  #playBtn.ready{color:#fff; background:linear-gradient(180deg,#e5237f,#a81259);
    border-color:var(--acc-glow); box-shadow:0 0 16px rgba(229,35,127,.35);}

  .autoline{background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; display:flex; justify-content:space-between; align-items:center;}
  .autoline .lbl{color:var(--dim); font-size:10px; letter-spacing:1px;}
  .toggle{width:36px;height:19px;border-radius:10px;background:#2a1412;border:1px solid var(--line);position:relative;cursor:pointer;}
  .toggle.on{background:var(--acc);box-shadow:0 0 10px rgba(229,35,127,.4);}
  .toggle .k{position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;background:var(--ink);transition:left .15s;}
  .toggle.on .k{left:18px;}

  audio{width:100%;}
  .hide{display:none !important;}
  .foot{margin-top:auto; display:flex; justify-content:space-between; font-size:8px; color:#4a2a24; letter-spacing:2px; padding:0 2px;}

  /* Bright Mode: Pink als Flaeche, dunkle Schrift */
  body.bright{--bg:#ffd9ec; --panel:#ffe3f1; --panel2:#ffcfe6; --line:#f2a8cc;
    --ink:#3a0a22; --dim:#9a3a62; --acc:#c2105f; --acc-deep:#8a0c44; --acc-glow:#e5237f;}
  body.bright .device{background:linear-gradient(170deg,#ffe3f1,#ffc4e2);}
  body.bright .status{background:#fff;}
  body.bright .status .s{color:#1a7a4a;}
  body.bright .meterbox{background:radial-gradient(ellipse at 50% 12%,#fff4e0,#ffd0e6 78%);}
  body.bright .recbtn .ring{background:#fff;}
  body.bright .brand .name{color:#c2105f; text-shadow:none;}
  body.bright .brand .ind{color:#9a3a62;}
  body.bright .brand .tag{color:#b05a7a;}
  body.bright button{background:#fff; color:#3a0a22;}
  body.bright #playBtn.ready{color:#fff; background:linear-gradient(180deg,#e5237f,#c2105f);}
  body.bright .foot{color:#b05a7a;}
</style>
</head>
<body>
<div class="device">
  <header>
    <div class="brand">
      <div class="ind"><i></i>SNAD INDUSTRIES</div>
      <div class="name">DREX-MB</div>
      <div class="tag">MOBILE VOCAL BOOTH</div>
    </div>
    <div class="modes">
      <span class="d" id="modeDark"></span>
      <span class="b" id="modeBright"></span>
    </div>
  </header>

  <div class="status">
    <span class="s" id="statusTxt">● BEREIT // 48 kHz</span>
    <span class="clip" id="clip">MONO</span>
  </div>

  <div class="meterbox">
    <svg id="meter" viewBox="0 0 320 168"></svg>
  </div>

  <div class="metroline">
    <div class="bpm" id="bpmBox">
      <span class="bpm-val" id="bpmVal">120</span>
      <span class="bpm-unit">BPM</span>
    </div>
    <button class="metrobtn" id="metroBtn" aria-label="Metronom an/aus">
      <svg viewBox="0 0 22 24" width="20" height="22" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M 9.5 2 L 12.5 2 L 18 19 L 4 19 Z M 10.4 4.5 L 11.6 4.5 L 15.3 16.5 L 6.7 16.5 Z"/><rect x="5.5" y="19" width="2.2" height="2.2"/><rect x="14.3" y="19" width="2.2" height="2.2"/><line x1="10" y1="16" x2="17" y2="1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button class="metronote" id="metroNote">A4</button>
  </div>

  <div class="recband">
    <div class="timer" id="timer">00:00.0</div>
    <div class="timer-sub" id="timerSub">BEREIT ZUR AUFNAHME</div>
    <div class="recbtn" id="recBtn"><div class="ring"><div class="core"></div></div></div>
    <div class="rec-hint">TIPPEN ZUM AUFNEHMEN</div>
  </div>

  <div class="rec-sub">
    <button id="playBtn" disabled>ANHOEREN</button>
    <button id="resetBtn" disabled>VERWERFEN</button>
  </div>

  <audio id="player" class="hide"></audio>

  <div class="autoline">
    <span class="lbl">AUTO-VEREDELUNG</span>
    <div class="toggle on" id="autoTog"><div class="k"></div></div>
  </div>

  <div class="foot">
    <span>SNAD INDUSTRIES</span>
    <span id="rev">REV 0.34</span>
  </div>
</div>

<script type="module">
/* ============================================================
   DREX-MB  REV 0.34  -  Ansicht 1: AUFNAHME
   Arc-Meter am echten Mikro, Rec/Timer, Auto-Veredelung-Schalter.
   ============================================================ */
const $=(id)=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";

/* ---------- ARC-METER aufbauen ---------- */
const svg=$("meter");
const N=30, cx=160, cy=250, R=190, a0=-130, a1=-50;
const segs=[];
const LABELS=[[-60,0],[-48,4],[-36,9],[-24,15],[-18,19],[-12,23],[-6,27],[0,29]];
function pt(ang,r){ const a=ang*Math.PI/180; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; }
function segHue(i){ const f=i/(N-1); return f<0.6?140:f<0.82?95:328; }
for(let i=0;i<N;i++){
  const ang=a0+(a1-a0)*(i/(N-1));
  const p1=pt(ang,R-20), p2=pt(ang,R);
  const ln=document.createElementNS(NS,"line");
  ln.setAttribute("x1",p1[0].toFixed(1)); ln.setAttribute("y1",p1[1].toFixed(1));
  ln.setAttribute("x2",p2[0].toFixed(1)); ln.setAttribute("y2",p2[1].toFixed(1));
  ln.setAttribute("stroke-width","5.4"); ln.setAttribute("stroke-linecap","butt");
  ln.dataset.hue=segHue(i);
  ln.setAttribute("stroke","hsl("+segHue(i)+",55%,14%)");
  svg.appendChild(ln); segs.push(ln);
}
LABELS.forEach(([db,i])=>{
  const ang=a0+(a1-a0)*(i/(N-1));
  const t1=pt(ang,R+2), t2=pt(ang,R+11);
  const tk=document.createElementNS(NS,"line");
  tk.setAttribute("x1",t1[0].toFixed(1)); tk.setAttribute("y1",t1[1].toFixed(1));
  tk.setAttribute("x2",t2[0].toFixed(1)); tk.setAttribute("y2",t2[1].toFixed(1));
  tk.setAttribute("stroke", db>=-6?"#ff3d93":"#4a6a50"); tk.setAttribute("stroke-width","1.2");
  svg.appendChild(tk);
  const tp=pt(ang,R+22);
  const tx=document.createElementNS(NS,"text");
  tx.setAttribute("x",tp[0].toFixed(1)); tx.setAttribute("y",tp[1].toFixed(1));
  tx.setAttribute("text-anchor","middle"); tx.setAttribute("font-size","9");
  tx.setAttribute("font-family","monospace"); tx.setAttribute("fill", db>=-6?"#ff5da3":"#e5237f");
  tx.textContent=db; svg.appendChild(tx);
});
const dbLbl=document.createElementNS(NS,"text");
dbLbl.setAttribute("x",cx); dbLbl.setAttribute("y","116"); dbLbl.setAttribute("text-anchor","middle");
dbLbl.setAttribute("font-size","13"); dbLbl.setAttribute("fill","#3a5a40");
dbLbl.setAttribute("letter-spacing","6"); dbLbl.setAttribute("font-family","serif");
dbLbl.textContent="dB"; svg.appendChild(dbLbl);

let meterLevel=0;
function paintMeter(frac){
  const lit=Math.round(frac*N);
  for(let i=0;i<N;i++){
    const h=segs[i].dataset.hue;
    const litCol = h==328 ? "hsl(328,85%,60%)" : "hsl("+h+",85%,52%)";
    segs[i].setAttribute("stroke", i<lit ? litCol : "hsl("+h+",55%,14%)");
  }
}

/* ---------- AUFNAHME ---------- */
let mediaStream=null, recorder=null, chunks=[], recWavBlob=null, recUrl=null;
let analyser=null, acMon=null, rafId=null, recStart=0, timerIv=null;
let recState="idle", countTimers=[];          // idle | countin | recording
let bpm=120, metroOn=false, metroRoot=69;      // A4 = MIDI 69

const device=document.querySelector(".device");
const recBtn=$("recBtn"), playBtn=$("playBtn"), resetBtn=$("resetBtn"),
      player=$("player"), timerEl=$("timer"), timerSub=$("timerSub"),
      clip=$("clip"), statusTxt=$("statusTxt"), autoTog=$("autoTog"),
      bpmBox=$("bpmBox"), bpmVal=$("bpmVal"), metroBtn=$("metroBtn"), metroNote=$("metroNote");

/* ---------- Metronom (gestimmt, aus DRECKSLER) ---------- */
const NOTE_NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function noteName(midi){ return NOTE_NAMES[((midi%12)+12)%12]+(Math.floor(midi/12)-1); }
function midiToHz(midi){ return 440*Math.pow(2,(midi-69)/12); }
function scheduleClick(ac, time, accent){
  const osc=ac.createOscillator(), g=ac.createGain();
  osc.type="sine"; osc.frequency.value=midiToHz(metroRoot);
  osc.connect(g); g.connect(ac.destination);
  if(accent){
    g.gain.setValueAtTime(0.0001,time);
    g.gain.exponentialRampToValueAtTime(0.34,time+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,time+0.18);
    osc.start(time); osc.stop(time+0.22);
  }else{
    g.gain.setValueAtTime(0.0001,time);
    g.gain.exponentialRampToValueAtTime(0.13,time+0.002);
    g.gain.exponentialRampToValueAtTime(0.0001,time+0.06);
    osc.start(time); osc.stop(time+0.08);
  }
}

function fmtTime(ms){ const s=ms/1000,m=Math.floor(s/60),r=(s%60);
  return String(m).padStart(2,"0")+":"+r.toFixed(1).padStart(4,"0"); }

function pickMime(){
  const o=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac"];
  for(const m of o){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }
  return "";
}

async function startRec(){
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }, video:false
    });
  }catch(e){ statusTxt.textContent="MIKRO ABGELEHNT"; statusTxt.style.color="var(--sig)"; return; }

  const AC=window.AudioContext||window.webkitAudioContext;
  acMon=new AC();
  const src=acMon.createMediaStreamSource(mediaStream);
  analyser=acMon.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.3;
  src.connect(analyser);

  chunks=[];
  const mime=pickMime();
  try{ recorder=mime?new MediaRecorder(mediaStream,{mimeType:mime}):new MediaRecorder(mediaStream); }
  catch(e){ statusTxt.textContent="RECORDER FEHLER"; return; }
  recorder.ondataavailable=(ev)=>{ if(ev.data&&ev.data.size) chunks.push(ev.data); };
  recorder.onstop=onRecStop;

  recBtn.classList.add("on");
  playBtn.disabled=true; playBtn.classList.remove("ready"); resetBtn.disabled=true;
  meterLoop();  // Meter + Schimmern laufen schon im Count-in

  // Count-in: 4 Beats einklicken, dann Aufnahme starten
  const beatDur=60/bpm, countBeats=4;
  const t0=acMon.currentTime+0.12;
  // Count-in-Klicks immer; Guide-Klicks waehrend der Aufnahme nur bei Metronom an.
  // Wir planen hier den Count-in; die Guide-Klicks laufen ueber metroTick ab Record-Start.
  for(let i=0;i<countBeats;i++) scheduleClick(acMon, t0+i*beatDur, i%4===0);

  recState="countin";
  statusTxt.style.color="var(--acc-glow)";
  timerEl.classList.add("rec");
  // Count-in-Anzeige
  let ci=countBeats;
  statusTxt.textContent="COUNT-IN // "+ci;
  const ciIv=setInterval(()=>{ ci--; if(ci>0) statusTxt.textContent="COUNT-IN // "+ci; },beatDur*1000);
  countTimers.push(ciIv);

  const startDelay=countBeats*beatDur*1000;
  countTimers.push(setTimeout(()=>{
    clearInterval(ciIv);
    if(recState!=="countin") return;   // abgebrochen
    try{ recorder.start(); }catch{}
    recState="recording";
    statusTxt.textContent="● AUFNAHME LAEUFT"; statusTxt.style.color="var(--acc-glow)";
    timerSub.textContent="AUFNAHME LAEUFT";
    recStart=performance.now();
    timerIv=setInterval(()=>{ timerEl.textContent=fmtTime(performance.now()-recStart); },100);
    if(metroOn) startMetro();
  }, startDelay));
}

/* Guide-Metronom waehrend der Aufnahme */
let metroIv=null, metroBeat=0;
function startMetro(){
  const beatDur=60/bpm;
  metroBeat=0;
  metroIv=setInterval(()=>{
    if(!acMon) return;
    scheduleClick(acMon, acMon.currentTime+0.02, metroBeat%4===0);
    metroBeat++;
  }, beatDur*1000);
}
function stopMetro(){ if(metroIv){ clearInterval(metroIv); metroIv=null; } }

function meterLoop(){
  if(!analyser) return;
  const buf=new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let peak=0; for(let i=0;i<buf.length;i++){ const a=Math.abs(buf[i]); if(a>peak) peak=a; }
  const db = peak>0 ? 20*Math.log10(peak) : -90;
  let frac=(db+54)/54; if(frac<0)frac=0; if(frac>1)frac=1;
  meterLevel += (frac-meterLevel)*0.4;
  paintMeter(meterLevel);
  // Schimmern: Device-Glow folgt dem Pegel (nur hoerbarer Bereich schimmert)
  device.style.setProperty("--shimmer", Math.max(0, (meterLevel-0.08)*1.1).toFixed(3));
  const over = db>-1.5;
  clip.textContent = over ? "CLIP" : "MONO";
  clip.classList.toggle("on", over);
  rafId=requestAnimationFrame(meterLoop);
}

function stopRec(){
  stopMetro();
  countTimers.forEach(t=>{ clearTimeout(t); clearInterval(t); }); countTimers=[];
  if(recState==="countin"){
    // Im Count-in abgebrochen: nie aufgenommen, sauber zuruecksetzen
    recState="idle";
    if(timerIv){ clearInterval(timerIv); timerIv=null; }
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
    if(acMon){ acMon.close(); acMon=null; } analyser=null;
    recBtn.classList.remove("on"); timerEl.classList.remove("rec");
    device.style.setProperty("--shimmer","0");
    statusTxt.textContent="● BEREIT // 48 kHz"; statusTxt.style.color="var(--ok)";
    timerSub.textContent="BEREIT ZUR AUFNAHME";
    return;
  }
  recState="idle";
  if(recorder&&recorder.state!=="inactive") recorder.stop();
  if(timerIv){ clearInterval(timerIv); timerIv=null; }
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
}

async function onRecStop(){
  stopMetro();
  if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
  if(acMon){ acMon.close(); acMon=null; } analyser=null;
  recBtn.classList.remove("on");
  timerEl.classList.remove("rec");
  device.style.setProperty("--shimmer","0");
  statusTxt.textContent="VERARBEITE..."; statusTxt.style.color="var(--acc-glow)";
  // Meter sanft auf null
  const fade=setInterval(()=>{ meterLevel*=0.8; paintMeter(meterLevel); if(meterLevel<0.01){ paintMeter(0); clearInterval(fade);} },40);

  const raw=new Blob(chunks,{type:chunks[0]?chunks[0].type:"audio/webm"});
  try{ recWavBlob=await toWav(raw); }
  catch(e){ statusTxt.textContent="WAV FEHLER"; return; }

  if(recUrl) URL.revokeObjectURL(recUrl);
  recUrl=URL.createObjectURL(recWavBlob);
  player.src=recUrl;
  playBtn.disabled=false; playBtn.classList.add("ready"); resetBtn.disabled=false;
  const kb=(recWavBlob.size/1024|0);
  statusTxt.textContent="● FERTIG // "+kb+" KB"; statusTxt.style.color="var(--ok)";
  timerSub.textContent = autoTog.classList.contains("on") ? "VEREDELT (Platzhalter)" : "ROH";
  clip.textContent="MONO"; clip.classList.remove("on");
}

/* webm/mp4 -> 16-bit PCM WAV */
async function toWav(blob){
  const ab=await blob.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext;
  const ac=new AC();
  const audio=await ac.decodeAudioData(ab);
  const wav=encodeWav(audio);
  ac.close();
  return new Blob([wav],{type:"audio/wav"});
}
function encodeWav(ab){
  const nCh=ab.numberOfChannels, sr=ab.sampleRate, len=ab.length;
  const ch=[]; for(let c=0;c<nCh;c++) ch.push(ab.getChannelData(c));
  const blockAlign=nCh*2, dataLen=len*blockAlign;
  const buffer=new ArrayBuffer(44+dataLen), view=new DataView(buffer);
  const ws=(o,s)=>{ for(let i=0;i<s.length;i++) view.setUint8(o+i,s.charCodeAt(i)); };
  ws(0,"RIFF"); view.setUint32(4,36+dataLen,true); ws(8,"WAVE");
  ws(12,"fmt "); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,nCh,true); view.setUint32(24,sr,true);
  view.setUint32(28,sr*blockAlign,true); view.setUint16(32,blockAlign,true); view.setUint16(34,16,true);
  ws(36,"data"); view.setUint32(40,dataLen,true);
  let off=44;
  for(let i=0;i<len;i++) for(let c=0;c<nCh;c++){
    let s=ch[c][i]; s=s<-1?-1:s>1?1:s;
    view.setInt16(off, s<0?s*0x8000:s*0x7fff, true); off+=2;
  }
  return buffer;
}

function resetRec(){
  recWavBlob=null;
  if(recUrl){ URL.revokeObjectURL(recUrl); recUrl=null; }
  player.src="";
  playBtn.disabled=true; playBtn.classList.remove("ready"); resetBtn.disabled=true;
  timerEl.textContent="00:00.0"; timerEl.classList.remove("rec"); timerSub.textContent="BEREIT ZUR AUFNAHME";
  statusTxt.textContent="● BEREIT // 48 kHz"; statusTxt.style.color="var(--ok)";
  paintMeter(0); meterLevel=0;
  device.style.setProperty("--shimmer","0");
}

recBtn.addEventListener("click", ()=>{
  if(recState==="recording"||recState==="countin") stopRec(); else startRec();
});
playBtn.addEventListener("click", ()=>player.play());
resetBtn.addEventListener("click", resetRec);
autoTog.addEventListener("click", ()=>autoTog.classList.toggle("on"));

/* ---------- Metronom-Bedienung ---------- */
metroBtn.addEventListener("click", ()=>{
  metroOn=!metroOn;
  metroBtn.classList.toggle("on", metroOn);
  metroNote.classList.toggle("on", metroOn);
  // waehrend laufender Aufnahme live zu/abschalten
  if(recState==="recording"){ if(metroOn) startMetro(); else stopMetro(); }
});
metroNote.textContent=noteName(metroRoot);
// Note durchsteppen (C3..C5), kurzer Weg ohne Popup
metroNote.addEventListener("click",()=>{
  metroRoot++; if(metroRoot>72) metroRoot=48;   // Bereich C3=48 .. C5=72
  metroNote.textContent=noteName(metroRoot);
});

/* ---------- BPM: ziehen (ns) + tippen zum Eintippen-Fallback ---------- */
function setBpm(v){ bpm=Math.max(40,Math.min(240,Math.round(v))); bpmVal.textContent=bpm; }
let bpmDragY=null, bpmStart=0;
bpmBox.addEventListener("pointerdown",(e)=>{ bpmDragY=e.clientY; bpmStart=bpm; bpmBox.setPointerCapture(e.pointerId); });
bpmBox.addEventListener("pointermove",(e)=>{ if(bpmDragY===null) return; setBpm(bpmStart+(bpmDragY-e.clientY)*0.5); });
bpmBox.addEventListener("pointerup",()=>{ bpmDragY=null; });

/* Dark / Bright */
$("modeBright").addEventListener("click", ()=>document.body.classList.add("bright"));
$("modeDark").addEventListener("click", ()=>document.body.classList.remove("bright"));
</script>
